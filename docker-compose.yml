version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: bhodbasha_postgres
    environment:
      POSTGRES_DB: bhodbasha_db
      POSTGRES_USER: bhodbasha_user
      POSTGRES_PASSWORD: bhodbasha_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bhodbasha_user -d bhodbasha_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bhodbasha_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bhodbasha_backend
    environment:
      BHODBASHA_ENV: production
      BHODBASHA_SECRET_KEY: bhodbasha_super_secret_jwt_key_for_offline_first_stem_platform_2026
      BHODBASHA_DATABASE_URL: postgresql+asyncpg://bhodbasha_user:bhodbasha_password@postgres:5432/bhodbasha_db
      REDIS_URL: redis://redis:6379/0
      MOCK_PROVIDERS: "true"
      NEXT_PUBLIC_SUPABASE_URL: https://demo-bhodbasha.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.demo-anon-key-bhodbasha
    ports:
      - "8000:8000"
    volumes:
      - ./backend/media_storage:/app/media_storage
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bhodbasha_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_APP_NAME: BhodBasha
      NEXT_PUBLIC_APP_TAGLINE: "Knowledge that speaks your language, even offline."
      NEXT_PUBLIC_SUPABASE_URL: https://demo-bhodbasha.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.demo-anon-key-bhodbasha
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
